<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Mesaj</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #93c5fd; cursor: wait; }
        
        .arama-butonu {
            background-color: #16a34a;
            display: block;
            text-decoration: none;
            color: white;
            padding: 12px 24px;
            margin: 8px 0;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .arama-butonu:hover { background-color: #15803d; }
        
        .iptal-butonu { background-color: #6b7280; }
        .iptal-butonu:hover { background-color: #4b5563; }

        input[type="tel"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        #durum {
            margin-top: 20px;
            font-weight: 500;
            min-height: 24px;
        }
        #pic{
            width: 50%;
            margin: auto;
            display: block;
        }
        .gizli { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <img id="pic" src="https://platincdn.com/1209/dosyalar/images/motosikletler/Honda%20Motosikletler/Honda%20Scooter/Honda%20PCX%20Yeni.jpeg">
    <h2>Bana Mesaj Gönder</h2>
    
    <div id="ana-menu">
        <p style="color: #4b5563; margin-bottom: 20px;">Araç sahibine kısa mesaj gönder!</p>

        <!-- Butonlar -->
        <button onclick="telefonIste('nezamangelirsin')"> Ne zaman geleceksiniz?</button>
        <button onclick="telefonIste('neredesiniz')"> Neredesiniz?</button>
        
        <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0;">
        
        <!-- Arama Butonu -->
        <a href="tel:05416506310" class="arama-butonu">📞 Hemen Ara (0541 650 63 10)</a>
    </div>

    <!-- Telefon Numarası İsteme Ekranı -->
    <div id="telefon-ekrani" class="gizli">
        <p style="color: #4b5563; margin-bottom: 10px;">Araç sahibinin size dönüş yapabilmesi için numaranızı girin:</p>
        <input type="tel" id="telefon-input" placeholder="05XX XXX XX XX">
        <button onclick="mailGonder()">Onayla ve Gönder</button>
        <button onclick="iptalEt()" class="iptal-butonu">Geri Dön</button>
    </div>

    <!-- Sonuç Mesajı -->
    <div id="durum"></div>
</div>

<script>
    const ACCESS_KEY = "8124b64a-7f60-462c-bcac-821e66ea16ca";

    const hazirCevaplar = {
        nezamangelirsin: "Ne zaman geleceksiniz?",
        neredesiniz: "Neredesiniz?", // Metin hatası düzeltildi
    };

    let secilenKonu = "";

    function telefonIste(secim) {
        secilenKonu = secim;
        document.getElementById("ana-menu").classList.add("gizli");
        document.getElementById("telefon-ekrani").classList.remove("gizli");
        document.getElementById("durum").innerText = "";
        document.getElementById("telefon-input").focus();
    }

    function iptalEt() {
        document.getElementById("telefon-ekrani").classList.add("gizli");
        document.getElementById("ana-menu").classList.remove("gizli");
        document.getElementById("telefon-input").value = "";
        document.getElementById("durum").innerText = "";
    }

    function mailGonder() {
        const telefonNumarasi = document.getElementById("telefon-input").value.trim();
        const durumMetni = document.getElementById("durum");

        if (telefonNumarasi.length < 10) {
            durumMetni.innerText = "❌ Lütfen geçerli bir telefon numarası girin.";
            durumMetni.style.color = "#dc2626";
            return;
        }

        const gonderButonu = document.querySelector("#telefon-ekrani button");
        const orjinalMetin = gonderButonu.innerText;
        
        gonderButonu.innerText = "Gönderiliyor...";
        gonderButonu.disabled = true;
        durumMetni.innerText = "";

        const sonMesaj = hazirCevaplar[secilenKonu] + "\n\nBana ulaşabileceğiniz numaram: " + telefonNumarasi;

        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                access_key: ACCESS_KEY,
                subject: 'BİRİSİ SANA ULAŞMAYA ÇALIŞIYOR',
                message: sonMesaj,
                from_name: 'ARAÇ NUMARATÖR HİZMETİ'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                iptalEt();
                durumMetni.innerText = "✅ Mesajınız başarıyla iletildi!";
                durumMetni.style.color = "#16a34a";
            } else {
                durumMetni.innerText = "❌ Bir hata oluştu, tekrar dene.";
                durumMetni.style.color = "#dc2626";
            }
        })
        .catch(error => {
            durumMetni.innerText = "❌ İnternet bağlantınızı kontrol edin.";
            durumMetni.style.color = "#dc2626";
        })
        .finally(() => {
            gonderButonu.innerText = orjinalMetin;
            gonderButonu.disabled = false;
        });
    }
</script>

</body>
</html>
